<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="My Voice">
<meta name="description" content="Speech recognition that learns how you talk, from about 30 phrases.">
<title>My Voice</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" href="fonts/Inter-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="2.8" width="6" height="11.6" rx="3"/><path d="M5.6 11.2a6.4 6.4 0 0 0 12.8 0M12 17.6v3.6M8.6 21.2h6.8"/></symbol>
  <symbol id="i-cap" viewBox="0 0 24 24"><path d="M2 9.2 12 4.5l10 4.7-10 4.7z"/><path d="M6.2 11.3v4.6c0 1.6 2.6 3.2 5.8 3.2s5.8-1.6 5.8-3.2v-4.6M22 9.2v5.6"/></symbol>
  <symbol id="i-playc" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.2"/><path d="M10 8.6v6.8l5.4-3.4z"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M14.5 6l-6 6 6 6"/></symbol>
  <symbol id="i-fwd" viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 6v12l10-6z"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11.5" height="11.5" rx="2.2"/><path d="M15.5 5.5V5.2A1.7 1.7 0 0 0 13.8 3.5H5.2A1.7 1.7 0 0 0 3.5 5.2v8.6a1.7 1.7 0 0 0 1.7 1.7h.3"/></symbol>
  <symbol id="i-speak" viewBox="0 0 24 24"><path d="M3.5 9.3h3.3L11 5.6v12.8l-4.2-3.7H3.5z"/><path d="M14.6 9.2a4 4 0 0 1 0 5.6M17.2 6.8a7.4 7.4 0 0 1 0 10.4"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 14.5V3.5M8 7.2l4-3.8 4 3.8M8.5 10.5H6.2a1.7 1.7 0 0 0-1.7 1.7v6.6a1.7 1.7 0 0 0 1.7 1.7h11.6a1.7 1.7 0 0 0 1.7-1.7v-6.6a1.7 1.7 0 0 0-1.7-1.7h-2.3"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h13.5M13 6.5l5.5 5.5-5.5 5.5"/></symbol>
</svg>

<p class="example" id="example" hidden>Example</p>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="sr-only" id="srStatus" aria-live="polite"></div>

<main class="views" id="views">

  <!-- TEACH -->
  <section class="view teach" id="view-teach" role="tabpanel" aria-labelledby="tab-teach">
    <div class="t-top">
      <button class="nav" id="backBtn" type="button" aria-label="Previous phrase"><svg class="ic"><use href="#i-back"/></svg></button>
      <p class="count" id="count">1 of 30</p>
      <button class="nav" id="skipBtn" type="button" aria-label="Skip to next phrase"><svg class="ic"><use href="#i-fwd"/></svg></button>
    </div>
    <div class="t-phrase">
      <h1 class="phrase" id="phrase" aria-live="polite"></h1>
    </div>
    <canvas class="wave" id="wave" aria-hidden="true"></canvas>
    <p class="hint" id="teachHint">tap the mic and read it aloud</p>
    <div class="mic-wrap" id="teachWrap">
      <span class="halo" aria-hidden="true"></span>
      <span class="rings" aria-hidden="true"><i></i><i></i><i></i></span>
      <button class="mic" id="teachMic" type="button" aria-label="Record this phrase"><svg class="ic"><use href="#i-mic"/></svg></button>
    </div>
    <p class="under" id="teachUnder">Tap to record.</p>
    <div class="t-extra">
      <button class="quiet" id="playBtn" type="button" hidden><svg class="ic sm"><use href="#i-play"/></svg>Play my take</button>
      <button class="go" id="goTrain" type="button" hidden>Train my voice<svg class="ic sm"><use href="#i-arrow"/></svg></button>
    </div>
  </section>

  <!-- TRAINING -->
  <section class="view training" id="view-training" role="tabpanel" aria-labelledby="tab-training" hidden>
    <div class="ring-box">
      <canvas class="ring" id="ring" aria-hidden="true"></canvas>
      <div class="ring-center">
        <p class="pct" id="pct"><span id="pctNum">0</span><span class="unit" id="pctUnit">%</span></p>
        <p class="ring-cap" id="ringCap"></p>
      </div>
    </div>
    <div class="tr-text">
      <h2 class="tr-title" id="trTitle" tabindex="-1">Learning your voice...</h2>
      <p class="tr-sub" id="trSub">Analyzing 0 recordings.</p>
      <p class="tr-eta" id="trEta"></p>
      <div class="tr-actions">
        <button class="btn" id="trainBtn" type="button">Train my voice</button>
        <button class="btn" id="tryBtn" type="button" hidden>Try it</button>
        <a class="link" id="saveBtn" href="#" download="my-voice.safetensors" hidden>Save my voice file</a>
      </div>
    </div>
    <p class="sr-only" id="trLive" aria-live="polite"></p>
  </section>

  <!-- TALK -->
  <section class="view talk" id="view-talk" role="tabpanel" aria-labelledby="tab-talk" hidden>
    <header class="talk-head"><h2>Talk</h2></header>
    <div class="talk-body">
      <div class="mic-wrap dark" id="talkWrap">
        <span class="halo" aria-hidden="true"></span>
        <span class="rings" aria-hidden="true"><i></i><i></i><i></i></span>
        <button class="mic" id="talkMic" type="button" aria-label="Start talking"><svg class="ic"><use href="#i-mic"/></svg></button>
      </div>
      <p class="under small" id="talkUnder">Tap to talk</p>
      <h3 class="sig">Speech Signature</h3>
      <div class="expect">
        <label class="sr-only" for="expected">What you'll say (optional)</label>
        <input id="expected" type="text" autocomplete="off" autocapitalize="sentences" enterkeyhint="done" placeholder="What you'll say (optional)">
        <button class="test" id="testBtn" type="button">Test phrase</button>
      </div>
      <div class="card reg" id="regCard">
        <p class="said" id="regText"></p>
        <p class="err" id="regErr"></p>
        <svg class="cwave" id="regWave" viewBox="0 0 340 56" preserveAspectRatio="none" aria-hidden="true"></svg>
      </div>
      <div class="card mine" id="mineCard">
        <p class="said" id="mineText"></p>
        <p class="err" id="mineErr"></p>
        <svg class="cwave" id="mineWave" viewBox="0 0 340 64" preserveAspectRatio="none" aria-hidden="true"></svg>
      </div>
      <p class="sr-only" id="resultSr" aria-live="polite"></p>
      <div class="acts">
        <button class="act" id="copyBtn" type="button" disabled><svg class="ic"><use href="#i-copy"/></svg>Copy</button>
        <button class="act" id="speakBtn" type="button" disabled><svg class="ic"><use href="#i-speak"/></svg>Speak</button>
        <button class="act" id="shareBtn" type="button" disabled><svg class="ic"><use href="#i-share"/></svg>Share</button>
      </div>
      <p class="voice-line"><span id="voiceLine">Using the shared model</span><span class="sep" aria-hidden="true">·</span><button class="vlink" id="loadBtn" type="button">Load voice file</button></p>
      <input type="file" id="voiceFile" accept=".safetensors,application/octet-stream" hidden>
    </div>
  </section>
</main>

<nav class="tabbar" id="tabbar" role="tablist" aria-label="Sections">
  <button class="tab" role="tab" id="tab-teach" aria-controls="view-teach" aria-selected="true" type="button">
    <span class="tab-ic"><svg class="ic"><use href="#i-cap"/></svg></span><span class="tab-l">Teach</span>
  </button>
  <button class="tab" role="tab" id="tab-training" aria-controls="view-training" aria-selected="false" tabindex="-1" type="button">
    <span class="tab-ic"><svg class="ic"><use href="#i-playc"/></svg><svg class="tprog" viewBox="0 0 24 24" aria-hidden="true"><circle id="tabProg" cx="12" cy="12" r="9.2" pathLength="100"/></svg></span><span class="tab-l">Training</span>
  </button>
  <button class="tab" role="tab" id="tab-talk" aria-controls="view-talk" aria-selected="false" tabindex="-1" type="button">
    <span class="tab-ic"><svg class="ic"><use href="#i-mic"/></svg></span><span class="tab-l">Talk</span>
  </button>
</nav>

<script src="app.js"></script>
</body>
</html>
